<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DoubaoTypeless</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --accent: #4f8cff;
    --accent-hover: #3a73e0;
    --text: #e4e6ed;
    --text-dim: #8b8fa3;
    --success: #34d399;
    --danger: #f87171;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 16px;
    padding-bottom: env(safe-area-inset-bottom, 16px);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .status {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 500;
  }
  .status.connected { background: rgba(52,211,153,0.15); color: var(--success); }
  .status.connecting,
  .status.reconnecting { background: rgba(79,140,255,0.15); color: var(--accent); }
  .status.disconnected { background: rgba(248,113,113,0.15); color: var(--danger); }
  .connection {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-reconnect {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 16px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
  }
  .btn-reconnect[hidden] { display: none; }

  .input-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #text-input {
    flex: 1;
    width: 100%;
    min-height: 200px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 17px;
    line-height: 1.6;
    padding: 14px;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
  }
  #text-input:focus { border-color: var(--accent); }
  #text-input::placeholder { color: var(--text-dim); }

  .char-count {
    text-align: right;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.97); }
  .btn-send {
    background: var(--accent);
    color: #fff;
  }
  .btn-send:hover { background: var(--accent-hover); }
  .btn-send:disabled { background: var(--border); color: var(--text-dim); }
  .btn-clear {
    flex: 0 0 auto;
    width: 80px;
    background: var(--surface);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }

  .sync-hint {
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 8px;
    transition: color 0.3s;
  }
  .sync-hint.syncing { color: var(--accent); }
  .sync-hint.synced { color: var(--success); }
  .sync-hint.disconnected { color: var(--danger); }
  .health {
    min-height: 18px;
    margin-top: 4px;
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
  }
  .health.ok { color: var(--success); }
  .health.warn { color: var(--accent); }
  .health.bad { color: var(--danger); }

  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="header">
  <h1>DoubaoTypeless</h1>
  <div class="connection">
    <span id="status" class="status disconnected">未连接</span>
    <button class="btn-reconnect" id="btn-reconnect" hidden>重连</button>
  </div>
</div>

<div class="input-area">
  <textarea id="text-input" placeholder="点击这里，切换到豆包输入法，用语音输入..."></textarea>
  <div class="char-count"><span id="char-count">0</span> 字</div>
</div>

<div class="sync-hint" id="sync-hint">输入后自动同步到电脑</div>
<div class="health" id="health">心跳: 未连接</div>

<div class="actions">
  <button class="btn btn-clear" id="btn-clear">清空</button>
  <button class="btn btn-send" id="btn-send" disabled>立即发送</button>
</div>

<div class="toast" id="toast"></div>

<script>
const WS_URL = "{{WS_URL}}";
const CLIENT_VERSION = "meta-v4";

const textInput = document.getElementById("text-input");
const btnSend = document.getElementById("btn-send");
const btnClear = document.getElementById("btn-clear");
const btnReconnect = document.getElementById("btn-reconnect");
const statusEl = document.getElementById("status");
const charCount = document.getElementById("char-count");
const syncHint = document.getElementById("sync-hint");
const healthEl = document.getElementById("health");
const toastEl = document.getElementById("toast");

let ws = null;
let reconnectTimer = null;
let autoSendTimer = null;
let stableTimer = null;
let lastSentText = "";
let isComposing = false;
let lastCompositionEndAt = 0;
let stableComposeRetries = 0;
let reconnectAttempts = 0;
let pingSentAt = 0;
let lastPongMs = null;
let lastPongAt = 0;
let lastSyncedAt = 0;
let healthReason = "未连接";

function timeLabel(ts = Date.now()) {
  return new Date(ts).toLocaleTimeString("zh-CN", { hour12: false });
}

function buildMeta(extra = {}) {
  return {
    clientVersion: CLIENT_VERSION,
    metaEnabled: true,
    isComposing: isComposing,
    sinceCompositionEndMs: lastCompositionEndAt ? Date.now() - lastCompositionEndAt : null,
    ...extra,
  };
}

function showToast(msg, duration = 1500) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), duration);
}

function renderHealth(kind = "warn") {
  healthEl.className = `health ${kind}`;
  const parts = [];
  if (lastPongMs !== null && lastPongAt) {
    parts.push(`心跳 ${lastPongMs}ms (${timeLabel(lastPongAt)})`);
  } else {
    parts.push(`心跳: ${healthReason}`);
  }
  if (lastSyncedAt) {
    parts.push(`上次同步 ${timeLabel(lastSyncedAt)}`);
  }
  healthEl.textContent = parts.join(" / ");
}

function setSyncState(state, detail = "") {
  syncHint.className = "sync-hint";
  if (state === "syncing") {
    syncHint.textContent = "正在同步...";
    syncHint.classList.add("syncing");
  } else if (state === "synced") {
    lastSyncedAt = Date.now();
    syncHint.textContent = `已同步到电脑 ${timeLabel(lastSyncedAt)}`;
    syncHint.classList.add("synced");
    renderHealth(lastPongMs === null ? "warn" : "ok");
  } else if (state === "disconnected") {
    syncHint.textContent = detail || "电脑未连接，正在等待重连";
    syncHint.classList.add("disconnected");
  } else {
    syncHint.textContent = "输入后自动同步到电脑";
  }
}

function setConnectionState(state, label = "") {
  const labels = {
    connected: "已连接",
    connecting: "连接中",
    reconnecting: "重连中",
    disconnected: "未连接",
  };
  statusEl.textContent = label || labels[state] || "未连接";
  statusEl.className = `status ${state}`;
  btnReconnect.hidden = state === "connected" || state === "connecting";
  btnSend.disabled = state !== "connected" || !textInput.value.trim();
  healthReason = label || labels[state] || "未连接";
  if (state !== "connected") {
    lastPongMs = null;
    renderHealth(state === "disconnected" ? "bad" : "warn");
  }
}

function sendPing() {
  if (!ws || ws.readyState !== 1) return;
  pingSentAt = Date.now();
  ws.send(JSON.stringify({ type: "ping", meta: buildMeta({ pingAt: pingSentAt }) }));
}

function connect() {
  if (ws && ws.readyState <= 1) return;
  setConnectionState("connecting");
  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    scheduleReconnect();
    return;
  }
  const socket = ws;

  socket.onopen = () => {
    if (ws !== socket) return;
    reconnectAttempts = 0;
    setConnectionState("connected");
    healthReason = "等待心跳";
    renderHealth("warn");
    if (!textInput.value.trim()) setSyncState("idle");
    showToast("已连接到电脑");
    socket.send(JSON.stringify({
      type: "hello",
      meta: buildMeta({
        compositionSupport: typeof CompositionEvent !== "undefined",
        userAgent: navigator.userAgent,
      }),
    }));
    sendPing();
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  };

  socket.onclose = () => {
    if (ws !== socket) return;
    ws = null;
    scheduleReconnect();
  };

  socket.onerror = () => {
    if (ws !== socket) return;
    setConnectionState("disconnected", "连接异常");
    setSyncState("disconnected", "连接异常，正在等待重连");
  };

  socket.onmessage = (e) => {
    if (ws !== socket) return;
    try {
      const data = JSON.parse(e.data);
      if (data.type === "pong") {
        const now = Date.now();
        if (pingSentAt) {
          lastPongMs = Math.max(0, now - pingSentAt);
        }
        lastPongAt = now;
        healthReason = "正常";
        renderHealth("ok");
      }
      if (data.type === "cleared") {
        if (stableTimer) { clearTimeout(stableTimer); stableTimer = null; }
        if (autoSendTimer) { clearTimeout(autoSendTimer); autoSendTimer = null; }
        stableComposeRetries = 0;
        textInput.value = "";
        charCount.textContent = "0";
        btnSend.disabled = true;
        lastSentText = "";
        setSyncState("idle");
        renderHealth(lastPongMs === null ? "warn" : "ok");
        showToast("电脑已插入，输入框已清空");
        if (socket.readyState === 1) {
          socket.send(JSON.stringify({ type: "update", text: "", meta: buildMeta() }));
        }
        textInput.focus();
      }
    } catch (_) {}
  };
}

function scheduleReconnect() {
  if (reconnectTimer) return;
  reconnectAttempts += 1;
  const delay = Math.min(10000, 3000 + (reconnectAttempts - 1) * 1000);
  setConnectionState("reconnecting");
  setSyncState("disconnected", `${Math.round(delay / 1000)} 秒后自动重连`);
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connect();
  }, delay);
}

function armStableTimer() {
  if (stableTimer) clearTimeout(stableTimer);
  const t = textInput.value.trim();
  if (!t || !ws || ws.readyState !== 1) return;

  const now = Date.now();
  const afterComp = now - lastCompositionEndAt < 800 ? 1200 : 2000;
  const delay = isComposing ? 2800 : afterComp;

  stableTimer = setTimeout(() => {
    stableTimer = null;
    const fresh = textInput.value.trim();
    if (!fresh || !ws || ws.readyState !== 1) return;
    if (isComposing) {
      if (stableComposeRetries < 40) {
        stableComposeRetries += 1;
        armStableTimer();
        return;
      }
      stableComposeRetries = 0;
    } else {
      stableComposeRetries = 0;
    }
    ws.send(JSON.stringify({
      type: "stable",
      text: fresh,
      meta: buildMeta({
        stableReason: isComposing ? "timer_forced_composing" : "timer",
      }),
    }));
    setSyncState("synced");
  }, delay);
}

function autoSync() {
  const text = textInput.value;
  if (!ws || ws.readyState !== 1) {
    setSyncState("disconnected", "电脑未连接，待重连后再同步");
    scheduleReconnect();
    return;
  }

  // 仅正文变化时发 update，避免刷屏；但 lastSentText 与 stable 定时器不能绑在一起：
  // 组字过程中已把 lastSentText 推到全文时，compositionend 后文本不变，仍必须 arm stable。
  if (text !== lastSentText) {
    lastSentText = text;
    setSyncState("syncing");
    ws.send(JSON.stringify({ type: "update", text: text, meta: buildMeta() }));
  }

  if (!text.trim()) {
    if (stableTimer) {
      clearTimeout(stableTimer);
      stableTimer = null;
    }
    stableComposeRetries = 0;
    return;
  }

  armStableTimer();
}

function sendNow() {
  const text = textInput.value.trim();
  if (!text) return;
  if (!ws || ws.readyState !== 1) {
    showToast("电脑未连接，正在重连");
    setSyncState("disconnected", "电脑未连接，待重连后再发送");
    scheduleReconnect();
    return;
  }
  if (stableTimer) clearTimeout(stableTimer);
  stableComposeRetries = 0;
  ws.send(JSON.stringify({
    type: "stable",
    text: text,
    meta: buildMeta({ stableReason: "manual_send" }),
  }));
  setSyncState("synced");
  showToast("已发送");
}

textInput.addEventListener("compositionstart", () => {
  isComposing = true;
  setSyncState("syncing");
  if (stableTimer) clearTimeout(stableTimer);
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({
      type: "composition",
      text: textInput.value,
      meta: buildMeta({ phase: "start" }),
    }));
  }
});

textInput.addEventListener("compositionend", () => {
  isComposing = false;
  lastCompositionEndAt = Date.now();
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({
      type: "composition",
      text: textInput.value,
      meta: buildMeta({ phase: "end" }),
    }));
  }
  if (autoSendTimer) clearTimeout(autoSendTimer);
  autoSendTimer = setTimeout(autoSync, 250);
});

textInput.addEventListener("input", (e) => {
  const len = textInput.value.length;
  charCount.textContent = len;
  btnSend.disabled = !textInput.value.trim() || !ws || ws.readyState !== 1;

  if (e.isComposing || isComposing) {
    if (autoSendTimer) clearTimeout(autoSendTimer);
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({
        type: "update",
        text: textInput.value,
        meta: buildMeta({
          inputType: e.inputType || null,
          eventIsComposing: !!e.isComposing,
        }),
      }));
    }
    autoSendTimer = setTimeout(autoSync, 180);
    return;
  }

  if (autoSendTimer) clearTimeout(autoSendTimer);
  autoSendTimer = setTimeout(autoSync, 450);
});

btnSend.addEventListener("click", sendNow);
btnReconnect.addEventListener("click", () => {
  if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
  }
  if (ws && ws.readyState <= 1) {
    try { ws.close(); } catch (_) {}
  }
  ws = null;
  showToast("正在重连");
  connect();
});
btnClear.addEventListener("click", () => {
  if (stableTimer) {
    clearTimeout(stableTimer);
    stableTimer = null;
  }
  stableComposeRetries = 0;
  textInput.value = "";
  charCount.textContent = "0";
  btnSend.disabled = true;
  lastSentText = "";
  setSyncState("idle");
  textInput.focus();
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: "update", text: "" }));
  }
});

setInterval(() => {
  sendPing();
}, 15000);

setInterval(() => {
  if (ws && ws.readyState === 1 && (!lastPongAt || Date.now() - lastPongAt > 22000)) {
    healthReason = "等待电脑响应";
    renderHealth("warn");
  }
}, 3000);

connect();
</script>
</body>
</html>
