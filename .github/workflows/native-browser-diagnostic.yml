name: Native source browser diagnostic
on:
  push:
    branches: [v3/integrated-preview-20260922]
permissions:
  contents: read
jobs:
  source-browser:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-v3-release.txt playwright==1.60.0
      - run: python -m playwright install chromium
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
      - name: Exercise native source without waiting for packaging
        run: python tools/verify_candidate_browser.py --source --report evidence/source-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-browser-${{ github.sha }}
          path: evidence/
