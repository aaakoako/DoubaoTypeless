name: V3 preview tests

on:
  push:
    branches: ["v3/**"]
  pull_request:
    branches: ["v3/**"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Frontend typecheck and production build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest httpx aiohttp Pillow playwright PySide6 qrcode
          python -m playwright install --with-deps chromium
      - name: Evidence checker self-test
        run: python -m unittest discover -s docs/v3-delivery/tests -v
      - name: V3 unit and production frontend tests
        run: python -m pytest -q --tb=short --junitxml=docs/evidence/v3-ci/junit.xml
      - name: Confirm no release side effects
        run: |
          test ! -f config.json
          python - <<'PY'
          print("preview workflow does not create tags or GitHub Releases")
          PY

  windows-min-pack:
    runs-on: windows-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install pack dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller aiohttp Pillow PySide6 pynput pywin32
      - name: Build isolated onedir
        run: python -m PyInstaller --noconfirm packaging/v3_preview.spec
      - name: Resource check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("dist/DoubaoTypelessV3Preview")
          exe = root / "DoubaoTypelessV3Preview.exe"
          assert exe.is_file(), exe
          assert not any(root.rglob("*WebEngine*"))
          assert any(root.rglob("pc.html")), "pc.html missing"
          assert any(p.name == "LICENSE" for p in root.rglob("LICENSE")), "LICENSE missing"
          assert any(root.rglob("index.html")), "web dist missing"
          print("min pack exe", exe, "bytes", exe.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3-preview-onedir
          path: dist/DoubaoTypelessV3Preview
          if-no-files-found: error
