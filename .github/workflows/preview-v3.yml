name: V3 preview tests

on:
  push:
    branches: ["v3/**"]
  pull_request:
    branches: ["v3/**"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest httpx aiohttp Pillow
      - name: V3 unit tests
        run: python -m pytest -q
      - name: Confirm no release side effects
        run: |
          test ! -f config.json
          python - <<'PY'
          print("preview workflow does not create tags or GitHub Releases")
          PY
