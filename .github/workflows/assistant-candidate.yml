name: Assistant V3 complete candidate
on:
  push:
    branches: ["v3/assistant-runtime-safety"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assistant-v3-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    if: github.ref == 'refs/heads/v3/assistant-runtime-safety'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Import exact source follow-up when present
        run: |
          if test -f .github/scripts/apply_stability_followup.py; then
            python .github/scripts/apply_stability_followup.py
          fi
      - name: Bind immutable source commit
        id: source
        run: |
          sha=$(git rev-parse HEAD)
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/dt-current-source
          git archive --format=tar HEAD > /tmp/dt-current-source/source.tar
          printf '%s\n' "$sha" > /tmp/dt-current-source/SOURCE_SHA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: assistant-source-${{ steps.source.outputs.source_sha }}
          path: /tmp/dt-current-source/
          retention-days: 3
          if-no-files-found: error
  validate:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies and production frontend
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
          python -m pip install -r requirements-test.txt PySide6 playwright
          python -m playwright install --with-deps chromium
          python tools/export_v3_icon.py
          cd web && npm ci && npm run typecheck && npm run build
      - name: Evidence checker self-test
        run: python -m unittest discover -s docs/v3-delivery/tests -v
      - name: Full tests without exclusions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --tb=short --junitxml=test-results.xml
      - name: Confirm isolated data
        run: test ! -f config.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-tests-${{ needs.source.outputs.source_sha }}
          path: test-results.xml
  windowed:
    needs: [source, validate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native dependencies and production frontend
        run: |
          python -m pip install -r requirements-test.txt PySide6 pywin32 pynput pyinstaller playwright comtypes
          python -m playwright install chromium
          python tools/export_v3_icon.py
          cd web
          npm ci
          npm run typecheck
          npm run build
      - name: Windows full tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --tb=short --junitxml=windows-tests.xml
      - name: Generate UIA wrappers and bind actual source version
        env:
          CANDIDATE_SHA: ${{ needs.source.outputs.source_sha }}
        shell: python
        run: |
          import json, os
          from pathlib import Path
          from comtypes.client import GetModule
          GetModule('UIAutomationCore.dll')
          Path('build-info.json').write_text(json.dumps({'source_sha':os.environ['CANDIDATE_SHA'],'channel':'v3-private-trial','release_ready':False}),encoding='utf-8')
      - name: Build real windowed candidate
        run: python -m PyInstaller --noconfirm packaging/v3_preview_windowed.spec
      - name: Run actual frozen startup and graceful exit
        run: python tools/verify_candidate_startup.py dist/DoubaoTypelessV3PreviewUI/DoubaoTypelessV3PreviewUI.exe --report candidate-startup.json
      - name: Real frozen EXE three text inserts with native hotkey and clipboard
        run: python tools/verify_candidate_text.py dist/DoubaoTypelessV3PreviewUI/DoubaoTypelessV3PreviewUI.exe --report candidate-text.json
      - name: Phone-owned latest draft with real frozen hotkey and clipboard
        run: python tools/verify_candidate_text.py dist/DoubaoTypelessV3PreviewUI/DoubaoTypelessV3PreviewUI.exe --phone-primary --report candidate-phone-primary.json
      - name: Frozen production phone, native HUD and real browser failure recovery
        timeout-minutes: 5
        run: python tools/verify_candidate_browser.py dist/DoubaoTypelessV3PreviewUI/DoubaoTypelessV3PreviewUI.exe --report candidate-browser.json
      - name: Full folder inventory and candidate archive
        shell: pwsh
        run: |
          $root = 'dist/DoubaoTypelessV3PreviewUI'
          if (Get-ChildItem $root -Recurse -Filter '*WebEngine*') { throw 'Unexpected WebEngine' }
          python tools/manifest_candidate.py $root --source-sha '${{ needs.source.outputs.source_sha }}' --output candidate-files.json
          Compress-Archive -Path "$root/*" -DestinationPath candidate-windowed.zip
          (Get-FileHash candidate-windowed.zip -Algorithm SHA256).Hash | Set-Content candidate-windowed.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V3-windowed-${{ needs.source.outputs.source_sha }}
          path: |
            candidate-windowed.zip
            candidate-windowed.sha256
            candidate-files.json
            candidate-startup.json
            candidate-startup-logs/
            candidate-text.json
            candidate-text-logs/
            candidate-phone-primary.json
            candidate-phone-primary-logs/
            candidate-browser.json
            candidate-browser.png
            candidate-browser-logs/
            windows-tests.xml
          if-no-files-found: warn
          retention-days: 14
